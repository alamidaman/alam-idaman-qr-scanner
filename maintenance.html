
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekod Bayaran Maintenance | Alam Idaman</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 25px auto;
    }

    .header {
      background: #123b65;
      color: white;
      padding: 24px;
      border-radius: 16px 16px 0 0;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      opacity: .85;
      font-size: 14px;
    }

    .search-box,
    .results {
      background: white;
      padding: 22px;
      border: 1px solid #e2e8f0;
    }

    .search-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #475569;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    input[readonly] {
      background: #f8fafc;
      color: #475569;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 20px;
      background: #1769aa;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .generate-button {
      width: 100%;
    }

    .results {
      border-radius: 0 0 16px 16px;
    }

    #status {
      margin: 0 0 16px;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 360px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: Consolas, monospace;
      font-size: 14px;
      line-height: 1.7;
      resize: vertical;
      white-space: pre;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .copy-button {
      flex: 1;
      background: #16803c;
    }

    .clear-button {
      background: #475569;
    }

    .note {
      margin-top: 16px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }

    .note strong {
      color: #334155;
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 8px auto;
      }

      .search-box {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        flex-direction: column;
      }

      .header h1 {
        font-size: 21px;
      }

      .copy-button,
      .clear-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Rekod Bayaran Maintenance</h1>
      <p>Alam Idaman · Sistem Maklumat Penduduk</p>
    </header>

    <section class="search-box">

      <div>
        <label for="currentMonth">Bulan Kutipan</label>
        <input
          id="currentMonth"
          type="text"
          readonly
        >
      </div>

      <div>
        <label for="blockInput">Blok</label>
        <select id="blockInput">
          <option value="">Memuatkan blok...</option>
        </select>
      </div>

      <div>
        <button
          id="generateButton"
          class="generate-button"
          type="button"
        >
          Jana Rekod
        </button>
      </div>

    </section>

    <section class="results">

      <div id="status" role="status">
        Sedang memuatkan data...
      </div>

      <textarea
        id="output"
        placeholder="Rekod maintenance akan dipaparkan di sini..."
        spellcheck="false"
      ></textarea>

      <div class="action-buttons">

        <button
          id="copyButton"
          class="copy-button"
          type="button"
        >
          Copy ke WhatsApp
        </button>

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          Kosongkan
        </button>

      </div>

      <div class="note">
        <strong>Format caj:</strong><br>
        RM80 = Maintenance asas<br>
        X = Caj tambahan kenderaan (RM10 setiap satu)<br>
        P = Sewa parking (RM20 setiap satu)<br>
        TT = Tertunggak (Dibincangkan)
      </div>

    </section>

  </main>

  <script>
    const BASE_MAINTENANCE = 80;
    const VEHICLE_LIMIT = 5;
    const VEHICLE_EXTRA_CHARGE = 10;
    const PARKING_CHARGE = 20;

    const currentMonthInput =
      document.getElementById('currentMonth');

    const blockInput =
      document.getElementById('blockInput');

    const generateButton =
      document.getElementById('generateButton');

    const statusBox =
      document.getElementById('status');

    const output =
      document.getElementById('output');

    let allRecords = [];

    /**
     * Bulan semasa menggunakan timezone Malaysia.
     */
    function getCurrentMonthYear() {
      const now = new Date();

      const monthNames = [
        'Januari',
        'Februari',
        'Mac',
        'April',
        'Mei',
        'Jun',
        'Julai',
        'Ogos',
        'September',
        'Oktober',
        'November',
        'Disember'
      ];

      const malaysiaDate = new Date(
        now.toLocaleString('en-US', {
          timeZone: 'Asia/Kuala_Lumpur'
        })
      );

      return {
        month: monthNames[malaysiaDate.getMonth()],
        year: malaysiaDate.getFullYear()
      };
    }

    function updateCurrentMonth() {
      const current = getCurrentMonthYear();

      currentMonthInput.value =
        current.month + ' ' + current.year;
    }

    /**
     * Tukar nombor kepada RM.
     */
    function money(value) {
      return 'RM' + Number(value || 0).toFixed(0);
    }

    /**
     * Kira caj dan bina baris WhatsApp.
     */
    function createLine(record) {
      const unit = String(record.unit || '').trim();

      const vehicleCount = Math.max(
        0,
        Number(record.vehicleCount || 0)
      );

      const parkingCount = Math.max(
        0,
        Number(record.parkingCount || 0)
      );

      const additionalPayment = Math.max(
        0,
        Number(record.additionalPayment || 0)
      );

      // Kenderaan yang lebih daripada 5 sahaja dikenakan X.
      const extraVehicles = Math.max(
        0,
        vehicleCount - VEHICLE_LIMIT
      );

      const vehicleCharge =
        extraVehicles * VEHICLE_EXTRA_CHARGE;

      const parkingCharge =
        parkingCount * PARKING_CHARGE;

      const total =
        BASE_MAINTENANCE +
        vehicleCharge +
        parkingCharge +
        additionalPayment;

      const parts = [unit];

      // TT ditentukan berdasarkan Penambahan Bayaran.
      if (additionalPayment > 0) {
        parts.push('TT');
      }

      // X = caj kenderaan tambahan.
      if (extraVehicles > 0) {
        parts.push(extraVehicles + 'X');
      }

      // P = sewa parking.
      if (parkingCount > 0) {
        parts.push(parkingCount + 'P');
      }

      parts.push(money(total));

      // Kolum terakhir dibiarkan kosong untuk status manual.
      return parts.join(' | ') + ' |';
    }

    /**
     * Susun unit mengikut nombor.
     */
    function sortUnits(a, b) {
      return String(a.unit).localeCompare(
        String(b.unit),
        undefined,
        {
          numeric: true,
          sensitivity: 'base'
        }
      );
    }

    /**
     * Tukar unit rumah kepada blok.
     * B-01-01 dan B-01-3A -> Blok 1
     * B-12-03 -> Blok 12
     */
    function getBlockFromUnit(unit) {
      const value = String(unit || '').trim().toUpperCase();
      const match = value.match(/^B-?(\\d{1,2})-/);

      if (!match) return '';

      const number = Number(match[1]);
      return number >= 1 && number <= 12
        ? 'Blok ' + number
        : '';
    }

    /**
     * Dropdown statik: sentiasa memaparkan Blok 1 hingga Blok 12,
     * tidak bergantung pada data yang berjaya dimuatkan.
     */
    function populateBlocks() {
      const currentValue = blockInput.value;
      blockInput.replaceChildren();

      for (let number = 1; number <= 12; number++) {
        const block = 'Blok ' + number;
        const option = document.createElement('option');

        option.value = block;
        option.textContent = block;
        blockInput.appendChild(option);
      }

      if (currentValue) {
        blockInput.value = currentValue;
      }
    }

    /**
     * Jana teks WhatsApp.
     */
    function generateRecords() {
      const block = blockInput.value;

      if (!block) {
        statusBox.textContent =
          'Sila pilih blok terlebih dahulu.';
        return;
      }

      const current = getCurrentMonthYear();

      const filtered = allRecords
        .filter(function(record) {
          return getBlockFromUnit(record.unit) === block;
        })
        .sort(sortUnits);

      let text = '';

      text += 'REKOD BAYARAN MAINTENANCE\n';
      text += 'Bulan: ' + current.month + ' ' + current.year + '\n';
      text += 'Blok: ' + block + '\n\n';

      if (!filtered.length) {
        text += 'Tiada rekod penduduk untuk blok ini.';
      } else {
        text += filtered
          .map(createLine)
          .join('\n');
      }

      output.value = text;

      statusBox.textContent =
        filtered.length +
        ' rekod dijana. Semak hasil sebelum copy ke WhatsApp.';
    }

    /**
     * Muat turun rekod dari Code.gs.
     */
    function loadData() {
      generateButton.disabled = true;
      statusBox.textContent = 'Sedang memuatkan data...';

      google.script.run
        .withSuccessHandler(function(records) {
          allRecords = Array.isArray(records) ? records : [];

          populateBlocks();

          statusBox.textContent =
            allRecords.length +
            ' rekod berjaya dimuatkan.';

          generateButton.disabled = false;

          if (allRecords.length > 0) {
            generateRecords();
          }
        })
        .withFailureHandler(function(error) {
          statusBox.textContent =
            'Gagal mendapatkan data: ' +
            (error.message || error);

          generateButton.disabled = false;
        })
        .getMaintenanceRecords();
    }

    /**
     * Copy teks ke clipboard.
     */
    async function copyToWhatsApp() {
      if (!output.value.trim()) {
        statusBox.textContent =
          'Tiada rekod untuk disalin.';
        return;
      }

      try {
        await navigator.clipboard.writeText(output.value);

        statusBox.textContent =
          'Rekod berjaya disalin. Boleh paste ke WhatsApp.';
      } catch (error) {
        output.focus();
        output.select();

        const copied = document.execCommand('copy');

        statusBox.textContent = copied
          ? 'Rekod berjaya disalin. Boleh paste ke WhatsApp.'
          : 'Sila pilih teks dan copy secara manual.';
      }
    }

    /**
     * Event listeners.
     */
    generateButton.addEventListener(
      'click',
      generateRecords
    );

    blockInput.addEventListener(
      'change',
      generateRecords
    );

    document.getElementById('copyButton')
      .addEventListener('click', copyToWhatsApp);

    document.getElementById('clearButton')
      .addEventListener('click', function() {
        output.value = '';

        statusBox.textContent =
          'Rekod dikosongkan.';
      });

    updateCurrentMonth();
    populateBlocks(); // Paparkan dropdown sebelum data/API dimuatkan\n    loadData();
  </script>
</body>
</html>
