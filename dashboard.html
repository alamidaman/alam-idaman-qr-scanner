<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard PPAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;font-family:Arial,sans-serif;color:#1d2939}header{background:#102b4e;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header h1{font-size:21px;margin:0}button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:bold}#logout{background:white;color:#102b4e}main{max-width:1000px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 5px 22px #102b4e12;margin-bottom:18px}h2{margin-top:0;color:#102b4e}.small{color:#667085;font-size:14px;line-height:1.6}.status{padding:12px;border-radius:8px;background:#fef3f2;color:#b42318;line-height:1.5}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.tile{border:1px solid #e4e7ec;border-radius:10px;padding:18px}.tile strong{display:block;color:#102b4e;margin-bottom:7px}
</style></head><body><header><h1>PORTAL PPAI — DASHBOARD</h1><button id="logout" type="button">Log Keluar</button></header>
<main><section class="card"><h2 id="welcome">Memeriksa sesi...</h2><p id="details" class="small">Sila tunggu sebentar.</p><div id="status" class="status">Menyemak sesi login...</div></section>
<section class="card"><h2>Menu PPAI</h2><div class="tiles"><div class="tile"><strong>Pengurusan Penduduk</strong><span class="small">Belum disambungkan kepada data.</span></div><div class="tile"><strong>Pengurusan Kenderaan</strong><span class="small">Belum disambungkan kepada data.</span></div><div class="tile"><strong>Pengurusan Pengguna</strong><span class="small">Belum disambungkan kepada data.</span></div></div></section></main>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbx9oBehFO9PApRCvdLTl7adSc4VRKfGvGOHJ5LsAVdnzQXEif0caZA_MJOZX3qKLFmLIA/exec';
const LOGIN_URL='login.html', TOKEN_KEY='PPAI_SESSION_TOKEN';
function jsonp(params){return new Promise((resolve,reject)=>{const cb='ppaiCb_'+Date.now()+'_'+Math.floor(Math.random()*1e5),s=document.createElement('script'),q=new URLSearchParams({...params,callback:cb});let ended=false;const timer=setTimeout(()=>finish(new Error('Sambungan tamat masa.')),10000);function finish(err,data){if(ended)return;ended=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('Backend tidak dapat dihubungi.'));s.src=GAS_URL+'?action=api&'+q.toString();document.body.appendChild(s);});}
function showLogin(msg){document.getElementById('welcome').textContent='Sesi tidak aktif';document.getElementById('details').textContent='';const box=document.getElementById('status');box.textContent=msg+' ';const a=document.createElement('a');a.href=LOGIN_URL;a.textContent='Pergi ke halaman login';box.appendChild(a);}
async function init(){const u=new URL(location.href),incoming=u.searchParams.get('token');if(incoming){sessionStorage.setItem(TOKEN_KEY,incoming);u.searchParams.delete('token');history.replaceState({},document.title,u.pathname+u.search+u.hash);}const token=sessionStorage.getItem(TOKEN_KEY);if(!token)return showLogin('Tiada sesi login.');try{const r=await jsonp({task:'me',token});if(!r.success){sessionStorage.removeItem(TOKEN_KEY);return showLogin(r.message||'Sesi tamat.');}document.getElementById('welcome').textContent='Selamat datang, '+(r.user.name||r.user.username);document.getElementById('details').textContent='Username: '+r.user.username+' | Peranan: '+r.user.role;const b=document.getElementById('status');b.textContent='Login berjaya. Sesi tamat selepas 30 minit.';b.style.background='#ecfdf3';b.style.color='#027a48';}catch(e){showLogin(e.message+' Sila cuba semula.');}}
document.getElementById('logout').addEventListener('click',async()=>{const t=sessionStorage.getItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);if(t){try{await jsonp({task:'logout',token:t});}catch(e){}}location.href=LOGIN_URL;});init();
</script></body></html>
